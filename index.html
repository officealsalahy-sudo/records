<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>سجل التوثيق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1720; --mut:#5b6672; --line:#dde2e8; --paper:#f1f3f5; --surf:#ffffff;
  --brand:#0f4c5c; --brand-ink:#ffffff; --brand-soft:#e3eef1;
  --danger:#b42318; --danger-soft:#fdecea; --ok:#14804a; --ok-soft:#e4f4ea;
  --t1:#2f5d8a; --t1s:#e6eef6; --t2:#a15c07; --t2s:#fbefd9; --t3:#55606b; --t3s:#e9ecef;
  --bar-h:84px;
}
@media(prefers-color-scheme:dark){:root{
  --ink:#eef2f5; --mut:#9aa6b2; --line:#2a333c; --paper:#0e1317; --surf:#161d23;
  --brand:#5fb3c7; --brand-ink:#06232b; --brand-soft:#17323a;
  --danger:#f0786b; --danger-soft:#3a1e1b; --ok:#5fcf8f; --ok-soft:#173326;
  --t1:#8db8e6; --t1s:#1b2a3a; --t2:#e7b15e; --t2s:#372a14; --t3:#aab4be; --t3s:#242c33;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
body.hasbar main{padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px) + 16px)}
button,input,textarea{font:inherit;color:inherit}
svg{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--surf);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 16px 0}
.top>div{max-width:640px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--brand)}
.brand svg{width:26px;height:26px}
.tbtn{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--mut);padding:10px 4px;font-size:15px;font-weight:500;cursor:pointer;min-height:44px}
.tbtn:hover{color:var(--ink)}

main{max-width:640px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;line-height:1.35;margin:4px 0 8px;font-weight:700}
h2{font-size:20px;margin:0 0 4px;font-weight:700}
.lead{color:var(--mut);margin:0 0 20px}
.mut{color:var(--mut);font-size:14px}

/* stepper */
.prog{display:flex;gap:6px;margin:2px 0 8px}
.prog i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.prog i.on{background:var(--brand)}
.stepline{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:18px}
.stepline b{color:var(--ink);font-weight:600}

/* form */
.fld{margin-bottom:18px}
.fld label{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.fld label small{color:var(--mut);font-weight:400}
.in{width:100%;min-height:54px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.in{min-height:120px;resize:vertical}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.in.bad{border-color:var(--danger)}
.help{color:var(--danger);font-size:14px;margin-top:6px;min-height:0}
.ltr{direction:ltr;text-align:right}

.opts{display:grid;gap:10px;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);cursor:pointer}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.on .dot{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.opt .dot svg{width:14px;height:14px;stroke-width:3;opacity:0}
.opt.on .dot svg{opacity:1}
.opt b{display:block;font-weight:600}
.opt span{color:var(--mut);font-size:14px}

.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 16px;border:2px dashed var(--line);border-radius:14px;background:var(--surf);cursor:pointer;color:var(--mut)}
.drop svg{width:34px;height:34px;color:var(--brand)}
.drop b{color:var(--ink);font-weight:600}
.drop input{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid .im{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.grid img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.grid .x{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;cursor:pointer}
.grid .x svg{width:16px;height:16px}

/* buttons + bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surf);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.p{flex:2;background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.d{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.o{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.tbtn:focus-visible,.opt:focus-visible,.row:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.alert{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:15px}
.note{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-size:15px}

/* home */
.steps{list-style:none;margin:0 0 8px;padding:0;border-top:1px solid var(--line)}
.steps li{display:flex;gap:14px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.steps span{color:var(--mut);font-size:14px;display:block}

/* review / detail */
.kv{margin:0;border-top:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.kv dt{color:var(--mut);font-size:15px}
.kv dd{margin:0;word-break:break-word}
.kv a{color:var(--brand);font-weight:500}

/* list */
.sbar{position:sticky;top:calc(59px + env(safe-area-inset-top,0px));z-index:4;background:var(--paper);padding:10px 0;display:flex;gap:8px}
.sbox{position:relative;flex:1}
.sbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.sbox .in{padding-right:44px}
.sq{width:54px;flex:none;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);display:grid;place-items:center;cursor:pointer}
.cnt{color:var(--mut);font-size:14px;margin:6px 2px 8px}
.rows{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:0;border-bottom:1px solid var(--line);background:none;padding:14px;cursor:pointer;min-height:68px}
.row:last-child{border-bottom:0}
.row:active{background:var(--paper)}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.rb{flex:1;min-width:0}
.rb b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb span{color:var(--mut);font-size:14px}
.rm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.chev{color:var(--mut);transform:scaleX(-1)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600}
.t1{background:var(--t1s);color:var(--t1)}.t2{background:var(--t2s);color:var(--t2)}.t3{background:var(--t3s);color:var(--t3)}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}

.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--brand);font-weight:600;padding:6px 0 14px;min-height:44px;cursor:pointer}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dh .av{width:56px;height:56px;font-size:22px}
.dh h1{margin:0;font-size:22px}

/* done */
.ok-wrap{text-align:center;padding:40px 8px}
.okc{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;animation:pop .35s ease-out}
.okc svg{width:42px;height:42px;stroke-width:2.6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* timeline */
.tl{position:relative;padding-right:20px;border-right:2px solid var(--line);margin:8px 8px 8px 0}
.it{position:relative;padding:0 0 26px}
.it::before{content:"";position:absolute;right:-27px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--paper)}
.idt{font-weight:700;font-size:17px}
.il{margin:6px 0;font-size:15px;word-break:break-all}.il a{color:var(--brand)}
.inote{margin:6px 0;white-space:pre-wrap}
.sbtn{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);cursor:pointer;font-size:14px;font-weight:600;color:var(--mut)}
.sbtn.d{border-color:var(--danger);background:var(--danger);color:#fff}
.irow{display:flex;gap:8px;margin-top:10px}
.sec{font-weight:700;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:82%;object-fit:contain}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.lb .c{top:calc(14px + env(safe-area-inset-top,0px));left:14px}
.lb .pv{right:12px;top:50%}.lb .nx{left:12px;top:50%}
.lb .ct{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));color:#fff;font-size:14px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* print */
#pa{display:none}
@media print{
  .top,main,.bar,.lb{display:none!important}
  body{background:#fff}
  #pa{display:block;color:#000;background:#fff;font-family:Tahoma,Arial,sans-serif}
  .rec{page-break-inside:avoid;border:1px solid #888;border-radius:8px;padding:12px;margin-bottom:14px}
  .rec h2{margin:0 0 8px;font-size:18px}
  .rec .kv div{grid-template-columns:110px 1fr;padding:5px 0}
  .rec .kv dt{color:#333}
  .pi{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .pi img{max-height:230px;max-width:48%;border:1px solid #888}
  .pinc{page-break-inside:avoid;border-top:1px solid #aaa;padding:8px 0;margin-top:8px}
  .rec{page-break-inside:auto!important}
}
</style>
</head>
<body>
<header class="top"><div>
  <div class="brand"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg><span>سجل التوثيق</span></div>
  <button class="tbtn" id="topAct" onclick="topAction()"></button>
</div></header>
<main id="app"></main>
<footer class="bar" id="bar"><div id="barIn"></div></footer>
<div id="pa"></div>

<script>
// رابط تطبيق الويب من Google Apps Script
const API = 'https://script.google.com/macros/s/AKfycbzzIVWyHITVEwYAQBqeApZQ8WgtEjebuxR87ldWJ9RIyvIj7YyWJh_Lv6WP23hdJnw-/exec';

const TYPES = [
  { v: 'تعليق', d: 'تعليق مسيء على منشور أو صفحة' },
  { v: 'إساءة لفظية', d: 'شتائم أو ألفاظ مسيئة' },
  { v: 'أمور أخرى', d: 'اكتب النوع بنفسك' }
];
const TT = { basic: 'البيانات الأساسية', addr: 'العنوان والصفحة', link: 'رابط الصفحة', type: 'نوع الإساءة والتاريخ', imgs: 'الصور' };
const seq = () => S.addPid ? ['link', 'type', 'imgs'] : ['basic', 'addr', 'type', 'imgs'];
const S = { view: 'home', step: 0, d: null, bad: {}, err: '', busy: 0, sending: 0, pin: '', rows: [], sel: null, q: '', delId: null, lb: null, loading: 0, addPid: null };

const I = {
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>',
  cam: '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  chk: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  ref: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.4-5.7M20 4v5h-5"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  print: '<svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1 1 0 01-1-1v-5a2 2 0 012-2h12a2 2 0 012 2v5a1 1 0 01-1 1h-2"/><rect x="7" y="14" width="10" height="6"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const today = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
const blank = () => ({ name: '', phone: '', address: '', type: '', typeOther: '', link: '', images: [], notes: '', idate: today() });
const typeText = d => d.type === 'أمور أخرى' && d.typeOther ? 'أمور أخرى: ' + d.typeOther : d.type;
const tcls = t => t === 'تعليق' ? 't1' : String(t).indexOf('إساءة لفظية') === 0 ? 't2' : 't3';
const thumb = id => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1000';
const initial = n => (String(n || '?').trim()[0] || '?');
const parts = s => String(s).split('-').map(Number);
const fmtD = s => { if (!s) return '—'; const [y, m, d] = parts(s); return new Date(y, m - 1, d).toLocaleDateString('ar-IQ', { day: 'numeric', month: 'long', year: 'numeric' }); };
const dnum = s => { const [y, m, d] = parts(s); return Date.UTC(y, m - 1, d) / 86400000; };
const gap = (a, b) => { const n = Math.round(dnum(a) - dnum(b)); if (n <= 0) return 'في نفس اليوم'; if (n < 31) return 'بعد ' + n + ' يوماً'; if (n < 365) return 'بعد ' + Math.round(n / 30) + ' شهراً'; return 'بعد ' + (n / 365).toFixed(1).replace('.0', '') + ' سنة'; };
const linkHtml = u => { if (!u) return '—'; try { const x = new URL(u); if (/^https?:$/.test(x.protocol)) return `<a href="${E(x.href)}" target="_blank" rel="noopener" dir="ltr">${E(u)}</a>`; } catch (e) {} return E(u); };

async function call(o) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(o) });
  return r.json();
}

/* ---------- render ---------- */
function R() {
  const v = VIEWS[S.view]();
  $('app').innerHTML = v.main;
  $('barIn').innerHTML = v.bar || '';
  $('bar').style.display = v.bar ? '' : 'none';
  document.body.classList.toggle('hasbar', !!v.bar);
  const t = $('topAct');
  if (S.pin) { t.innerHTML = I.out + 'خروج'; t.style.display = ''; }
  else if (S.view === 'home' || S.view === 'done') { t.innerHTML = I.lock + 'المسؤول'; t.style.display = ''; }
  else t.style.display = 'none';
  document.querySelectorAll('.lb').forEach(x => x.remove());
  if (S.lb) {
    const L = S.lb, o = document.createElement('div'); o.className = 'lb';
    o.innerHTML = `<img src="${E(L.list[L.i])}"><button class="c" onclick="lb(0)" aria-label="إغلاق">${I.x}</button>`
      + (L.list.length > 1 ? `<button class="pv" onclick="lb(-1)" aria-label="السابق">${I.chev}</button><button class="nx" onclick="lb(1)" aria-label="التالي">${I.chev.replace('<svg', '<svg style="transform:scaleX(-1)"')}</button><div class="ct">${L.i + 1} / ${L.list.length}</div>` : '');
    document.body.appendChild(o);
  }
}
const go = v => { S.view = v; S.err = ''; S.delId = null; S.lb = null; R(); scrollTo(0, 0); };
function lb(d) { if (d === 0) S.lb = null; else S.lb.i = (S.lb.i + d + S.lb.list.length) % S.lb.list.length; R(); }
function openLb(id, i) { const it = S.rows.find(x => x.id === id); S.lb = { list: it.images.map(thumb), i }; R(); }
function topAction() { if (S.pin) { S.pin = ''; S.rows = []; S.q = ''; go('home'); } else go('login'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.lb) lb(0); });

const btn = (txt, fn, cls = '', dis = false, ico = '') => `<button class="btn ${cls}" onclick="${fn}" ${dis ? 'disabled' : ''}>${ico}${txt}</button>`;
const alertBox = () => S.err ? `<div class="alert" role="alert">${E(S.err)}</div>` : '';
const VIEWS = { home, wizard, review, done, login, list, detail };

/* ---------- تجميع الوقائع حسب الشخص ---------- */
function groups() {
  const m = new Map();
  S.rows.forEach(r => { const k = r.pid || r.id; let g = m.get(k); if (!g) { g = { pid: k, items: [] }; m.set(k, g); } g.items.push(r); });
  const a = [...m.values()];
  a.forEach(g => {
    g.items.sort((x, y) => (y.idate || '').localeCompare(x.idate || ''));
    const f = k => (g.items.find(i => i[k]) || {})[k] || '';
    g.name = g.items[0].name; g.phone = f('phone'); g.address = f('address'); g.last = g.items[0].idate;
  });
  return a.sort((x, y) => (y.last || '').localeCompare(x.last || ''));
}

/* ---------- الإدخال ---------- */
function home() {
  const st = seq();
  return {
    main: `<h1>توثيق إساءة جديدة</h1><p class="lead">سجّل بيانات الشخص على أربع خطوات قصيرة. تقدر ترجع للخطوة السابقة بأي وقت.</p>
    <ol class="steps">${['basic', 'addr', 'type', 'imgs'].map((k, i) => `<li><div class="n">${i + 1}</div><div><b>${TT[k]}</b></div></li>`).join('')}</ol>`,
    bar: btn('بدء تسجيل جديد', 'newRec()', 'p', false, I.plus)
  };
}
function newRec() { S.addPid = null; S.d = blank(); S.step = 0; S.bad = {}; go('wizard'); }
function addInc(pid) {
  const g = groups().find(x => x.pid === pid); if (!g) return;
  S.addPid = pid; S.d = Object.assign(blank(), { name: g.name, phone: g.phone, address: g.address });
  S.step = 0; S.bad = {}; go('wizard');
}
function cancel() { if (S.pin) { S.addPid ? go('detail') : go('list'); } else go('home'); }

function field(k, label, o = {}) {
  const v = E(S.d[k]), bad = S.bad[k];
  const ctl = o.ta
    ? `<textarea class="in${bad ? ' bad' : ''}" id="f_${k}" oninput="S.d.${k}=this.value">${v}</textarea>`
    : `<input class="in${o.ltr ? ' ltr' : ''}${bad ? ' bad' : ''}" id="f_${k}" type="${o.tp || 'text'}" ${o.im ? `inputmode="${o.im}"` : ''} ${o.max ? `max="${o.max}"` : ''} placeholder="${E(o.ph || '')}" value="${v}" autocomplete="off" oninput="S.d.${k}=this.value;this.classList.remove('bad')">`;
  return `<div class="fld"><label for="f_${k}">${label}${o.opt ? ' <small>(اختياري)</small>' : ''}</label>${ctl}${bad ? `<div class="help">${bad}</div>` : ''}</div>`;
}
function wizard() {
  const d = S.d, st = seq(), key = st[S.step]; let b = '';
  if (key === 'basic') b = field('name', 'الاسم') + field('phone', 'رقم الهاتف', { opt: 1, tp: 'tel', im: 'tel', ltr: 1, ph: '07xxxxxxxxx' });
  if (key === 'addr') b = field('address', 'العنوان', { opt: 1 }) + field('link', 'رابط صفحة فيسبوك أو تيكتوك أو انستا', { opt: 1, tp: 'url', im: 'url', ltr: 1, ph: 'https://' });
  if (key === 'link') b = field('link', 'رابط صفحة فيسبوك أو تيكتوك أو انستا', { opt: 1, tp: 'url', im: 'url', ltr: 1, ph: 'https://' });
  if (key === 'type') {
    b = `<div class="fld"><label>نوع الإساءة</label></div><div class="opts" role="radiogroup">${TYPES.map(t => `<button type="button" role="radio" aria-checked="${d.type === t.v}" class="opt${d.type === t.v ? ' on' : ''}" onclick="pick('${t.v}')"><div class="dot">${I.chk}</div><div><b>${t.v}</b><span>${t.d}</span></div></button>`).join('')}</div>`
      + (S.bad.type ? `<div class="help" style="margin:-8px 0 14px">${S.bad.type}</div>` : '')
      + (d.type === 'أمور أخرى' ? field('typeOther', 'اكتب نوع الإساءة', { ph: 'مثال: تهديد' }) : '')
      + field('idate', 'تاريخ الواقعة', { tp: 'date', ltr: 1, max: today() })
      + field('notes', 'ملاحظات', { opt: 1, ta: 1 });
  }
  if (key === 'imgs') {
    b = `<label class="drop"><input type="file" accept="image/*" multiple onchange="upl(this)">${I.cam}<b>اضغط لإضافة صور</b><span class="mut">من المعرض أو الكاميرا، حتى 10 صور</span></label>`
      + (d.images.length || S.busy ? `<div class="grid">${d.images.map((m, i) => `<div class="im"><img src="${m}" alt="صورة ${i + 1}" onclick="S.lb={list:S.d.images,i:${i}};R()"><button class="x" onclick="S.d.images.splice(${i},1);R()" aria-label="حذف الصورة">${I.x}</button></div>`).join('')}${S.busy ? '<div class="im" style="display:grid;place-items:center"><div class="spin"></div></div>' : ''}</div>` : '');
  }
  return {
    main: `<div class="prog">${st.map((_, i) => `<i class="${i <= S.step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="stepline"><b>${TT[key]}</b><span>${S.step + 1} من ${st.length}</span></div>
      ${S.addPid ? `<div class="note">واقعة جديدة للشخص: <b>${E(d.name)}</b></div>` : ''}${alertBox()}${b}`,
    bar: btn(S.step ? 'السابق' : 'إلغاء', S.step ? 'back_()' : 'cancel()') + btn('التالي', 'nx()', 'p', S.busy > 0)
  };
}
function pick(v) { S.d.type = v; delete S.bad.type; R(); }
function back_() { S.err = ''; S.step--; R(); scrollTo(0, 0); }
function nx() {
  const d = S.d, key = seq()[S.step]; S.bad = {}; S.err = '';
  if (key === 'basic' && !d.name.trim()) S.bad.name = 'اكتب اسم الشخص';
  if (key === 'type') {
    if (!d.type) S.bad.type = 'اختر نوع الإساءة';
    else if (d.type === 'أمور أخرى' && !d.typeOther.trim()) S.bad.typeOther = 'اكتب نوع الإساءة';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.idate || '')) S.bad.idate = 'اختر تاريخ الواقعة';
  }
  if (Object.keys(S.bad).length) { R(); return; }
  if (S.step === seq().length - 1) S.view = 'review'; else S.step++;
  R(); scrollTo(0, 0);
}
function kv(d, nImg) {
  return `<dl class="kv"><div><dt>الاسم</dt><dd>${E(d.name)}</dd></div><div><dt>الهاتف</dt><dd class="ltr" style="text-align:right">${E(d.phone || '—')}</dd></div><div><dt>العنوان</dt><dd>${E(d.address || '—')}</dd></div><div><dt>نوع الإساءة</dt><dd>${E(typeText(d))}</dd></div><div><dt>تاريخ الواقعة</dt><dd>${fmtD(d.idate)}</dd></div><div><dt>الرابط</dt><dd>${linkHtml(d.link)}</dd></div><div><dt>الصور</dt><dd>${nImg}</dd></div><div><dt>الملاحظات</dt><dd>${E(d.notes || '—')}</dd></div></dl>`;
}
function review() {
  const d = S.d;
  return {
    main: `<h2>${S.addPid ? 'مراجعة الواقعة الجديدة' : 'راجع البيانات'}</h2><p class="lead">تأكد من المعلومات قبل الحفظ.</p>${alertBox()}${kv(d, d.images.length)}
      ${d.images.length ? `<div class="grid">${d.images.map((m, i) => `<div class="im"><img src="${m}" alt="" onclick="S.lb={list:S.d.images,i:${i}};R()"></div>`).join('')}</div>` : ''}`,
    bar: btn('تعديل', "S.view='wizard';S.step=0;R()", '', S.sending > 0) + btn(S.sending ? '<span class="spin"></span>جاري الحفظ' : 'حفظ', 'send()', 'p', S.sending > 0)
  };
}
function shrink(f) {
  return new Promise((ok, no) => {
    const r = new FileReader(); r.onerror = no;
    r.onload = () => { const im = new Image(); im.onerror = no; im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .68)); };
      im.src = r.result; };
    r.readAsDataURL(f);
  });
}
async function upl(inp) {
  const fs = [...inp.files]; inp.value = ''; if (!fs.length) return;
  S.busy++; S.err = ''; R();
  for (const f of fs) { try { if (S.d.images.length < 10) S.d.images.push(await shrink(f)); } catch (e) { S.err = 'تعذّر قراءة إحدى الصور'; } }
  S.busy--; R();
}
async function send() {
  S.sending = 1; S.err = ''; R();
  try {
    const d = S.d, r = await call({ action: 'add', data: { name: d.name, phone: d.phone, address: d.address, type: typeText(d), link: d.link, notes: d.notes, images: d.images, idate: d.idate, pid: S.addPid || '' } });
    S.sending = 0;
    if (r.ok) {
      if (S.pin && r.row) { S.rows.unshift(r.row); if (S.addPid) { S.sel = S.addPid; return go('detail'); } return go('list'); }
      return go('done');
    }
    S.err = 'لم يتم الحفظ. حاول مرة أخرى.'; R();
  } catch (e) { S.sending = 0; S.err = 'تعذّر الاتصال. تأكد من الإنترنت ثم اضغط حفظ مرة ثانية.'; R(); }
}
function done() {
  return {
    main: `<div class="ok-wrap"><div class="okc">${I.chk}</div><h1>تم الحفظ</h1><p class="lead">سُجّلت البيانات بنجاح.</p></div>`,
    bar: btn('الرئيسية', "go('home')") + btn('إضافة شخص آخر', 'newRec()', 'p', false, I.plus)
  };
}

/* ---------- المسؤول ---------- */
function login() {
  return {
    main: `<button class="back" onclick="go('home')">${I.chev}رجوع</button><h1>دخول المسؤول</h1><p class="lead">اكتب الرمز لعرض السجلات والبحث والطباعة.</p>${alertBox()}
      <div class="fld"><label for="pin">الرمز</label><input class="in ltr" id="pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')enter()"></div>`,
    bar: btn(S.loading ? '<span class="spin"></span>جاري التحقق' : 'دخول', 'enter()', 'p', S.loading > 0)
  };
}
async function load() {
  const r = await call({ action: 'list', pin: S.pin });
  if (!r.ok) throw new Error(r.error === 'pin' ? 'pin' : 'err');
  S.rows = r.rows;
}
async function enter() {
  const v = $('pin').value; if (!v) return;
  S.pin = v; S.loading = 1; S.err = ''; R();
  try { await load(); S.loading = 0; go('list'); }
  catch (e) { S.loading = 0; S.pin = ''; S.err = e.message === 'pin' ? 'الرمز غير صحيح' : 'تعذّر الاتصال. حاول مرة أخرى.'; R(); }
}
const hay = r => [r.name, r.phone, r.address, r.link, r.type, r.notes].join(' ').toLowerCase();
const flt = () => { const q = S.q.trim().toLowerCase(); return groups().filter(g => !q || g.items.some(r => hay(r).includes(q))); };
function rowsHtml() {
  const L = flt();
  if (!L.length) return `<div class="empty">${S.rows.length ? 'لا توجد نتائج للبحث' : 'لا توجد سجلات بعد'}</div>`;
  return `<div class="cnt">${L.length} شخص</div><div class="rows">${L.map(g => `<button class="row" onclick="S.sel='${g.pid}';go('detail')"><div class="av">${E(initial(g.name))}</div><div class="rb"><b>${E(g.name)}</b><span>آخر واقعة: ${fmtD(g.last)}</span></div><div class="rm">${g.items.length > 1 ? `<span class="badge t2">${g.items.length} وقائع</span>` : `<span class="badge ${tcls(g.items[0].type)}">${E(g.items[0].type.split(':')[0])}</span>`}${g.items.reduce((n, i) => n + i.images.length, 0) ? `<span class="mut">${g.items.reduce((n, i) => n + i.images.length, 0)} صورة</span>` : ''}</div></button>`).join('')}</div>`;
}
function list() {
  return {
    main: `${alertBox()}<div class="sbar"><div class="sbox">${I.search}<input class="in" id="q" placeholder="ابحث بالاسم أو الهاتف أو الرابط" value="${E(S.q)}" oninput="S.q=this.value;$('ls').innerHTML=rowsHtml()"></div><button class="sq" onclick="refresh()" aria-label="تحديث">${I.ref}</button></div><div id="ls">${rowsHtml()}</div>`,
    bar: btn('طباعة', 'printList()', '', !S.rows.length, I.print) + btn('شخص جديد', 'newRec()', 'p', false, I.plus)
  };
}
async function refresh() { try { await load(); S.err = ''; R(); } catch (e) { S.err = 'تعذّر التحديث'; R(); } }

function incHtml(it, i, items) {
  const prev = items[i + 1];
  return `<div class="it"><div class="idt">${fmtD(it.idate)}</div>
    <div class="mut">${prev ? gap(it.idate, prev.idate) + ' من الواقعة السابقة' : 'أول واقعة مسجّلة'}</div>
    <div style="margin:8px 0"><span class="badge ${tcls(it.type)}">${E(it.type)}</span></div>
    ${it.link ? `<div class="il">${linkHtml(it.link)}</div>` : ''}
    ${it.notes ? `<p class="inote">${E(it.notes)}</p>` : ''}
    ${it.images.length ? `<div class="grid">${it.images.map((id, k) => `<div class="im"><img src="${thumb(id)}" alt="صورة ${k + 1}" loading="lazy" onclick="openLb('${it.id}',${k})"></div>`).join('')}</div>` : ''}
    <div class="irow">${S.delId === it.id
      ? `<button class="sbtn d" onclick="delRec('${it.id}')" ${S.loading ? 'disabled' : ''}>${S.loading ? 'جاري الحذف…' : 'تأكيد حذف الواقعة'}</button><button class="sbtn" onclick="S.delId=null;R()">إلغاء</button>`
      : `<button class="sbtn" onclick="S.delId='${it.id}';R()">حذف الواقعة</button>`}</div></div>`;
}
function detail() {
  const g = groups().find(x => x.pid === S.sel); if (!g) { S.view = 'list'; return list(); }
  const nImg = g.items.reduce((n, i) => n + i.images.length, 0);
  return {
    main: `<button class="back" onclick="go('list')">${I.chev}كل الأشخاص</button>
      <div class="dh"><div class="av">${E(initial(g.name))}</div><div><h1>${E(g.name)}</h1><span class="mut">${g.items.length} ${g.items.length > 2 ? 'وقائع' : g.items.length === 2 ? 'واقعتان' : 'واقعة'} · ${nImg} صورة</span></div></div>
      ${alertBox()}
      <dl class="kv"><div><dt>الهاتف</dt><dd class="ltr" style="text-align:right">${E(g.phone || '—')}</dd></div><div><dt>العنوان</dt><dd>${E(g.address || '—')}</dd></div></dl>
      <div class="sec">سجل الوقائع</div><div class="tl">${g.items.map((it, i) => incHtml(it, i, g.items)).join('')}</div>`,
    bar: btn('طباعة', `printOne('${g.pid}')`, '', false, I.print) + btn('واقعة جديدة', `addInc('${g.pid}')`, 'p', false, I.plus)
  };
}
async function delRec(id) {
  S.loading = 1; S.err = ''; R();
  try {
    const r = await call({ action: 'delete', pin: S.pin, id }); if (!r.ok) throw 0;
    S.rows = S.rows.filter(x => x.id !== id); S.loading = 0; S.delId = null;
    if (!groups().some(g => g.pid === S.sel)) return go('list');
    R();
  } catch (e) { S.loading = 0; S.delId = null; S.err = 'تعذّر الحذف. حاول مرة أخرى.'; R(); }
}

/* ---------- الطباعة ---------- */
const prG = g => `<div class="rec"><h2>${E(g.name)}</h2><dl class="kv"><div><dt>الهاتف</dt><dd>${E(g.phone || '—')}</dd></div><div><dt>العنوان</dt><dd>${E(g.address || '—')}</dd></div><div><dt>عدد الوقائع</dt><dd>${g.items.length}</dd></div></dl>`
  + g.items.slice().reverse().map(p => `<div class="pinc"><b>${fmtD(p.idate)}</b> — ${E(p.type)}<br>${p.link ? `<span dir="ltr">${E(p.link)}</span><br>` : ''}${p.notes ? E(p.notes) + '<br>' : ''}${p.images.length ? `<div class="pi">${p.images.map(id => `<img src="${thumb(id)}">`).join('')}</div>` : ''}</div>`).join('') + '</div>';
function doPrint(h) { $('pa').innerHTML = h; setTimeout(() => print(), 700); }
const printOne = pid => doPrint(prG(groups().find(x => x.pid === pid)));
const printList = () => doPrint(flt().map(prG).join(''));

R();
</script>
</body>
</html>
